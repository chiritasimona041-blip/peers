<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | The Peers Certification</title>
<meta name="description" content="Ask us a question.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=20261127e">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1D1916">
</head>
<body>
<div id="site-header"></div>
<main class="wrap sec-s"><form class="authbox" id="f" novalidate style="max-width:560px"><p class="eyebrow">Contact</p><h1 class="d3">Ask us <em>anything.</em></h1>
<div class="field"><label for="n">Your name</label><input id="n" type="text" autocomplete="name" required></div>
<div class="field"><label for="e">Email address</label><input id="e" type="email" autocomplete="email" required></div>
<div class="field"><label for="q">Your message</label><textarea id="q" required></textarea></div>
<button class="btn btn-sea btn-block" type="submit">Send message</button><p class="note hide" role="status" id="m"></p></form></main>
<div id="site-footer"></div>
<script src="/assets/app.js?v=20261127b"></script>
<script>
var T = window.TCC, m = document.getElementById('m');
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var n = document.getElementById('n').value.trim(), e = document.getElementById('e').value.trim(), q = document.getElementById('q').value.trim(), form = this;
  if (!n || !q) return T.note(m, 'Please add your name and a message.', 'bad');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return T.note(m, 'Please enter a valid email address.', 'bad');
  T.api('POST', '/api/db/add', { coll: 'leads/contact/items', data: { kind: 'contact', subject: 'Website enquiry from ' + n, fields: { Name: n, Email: e, Message: q } } })
    .then(function () { form.reset(); T.note(m, 'Thank you. Your message has been received and we will reply by email.', 'good'); }, function (er) { T.note(m, er.message, 'bad'); });
});
</script>
</body>
</html>
