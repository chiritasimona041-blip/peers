<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your certificate | The Peers Certification</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=20261127e">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1D1916">
</head>
<body>
<div id="site-header"></div>
<main class="app"><div class="wrap sec-s stack" style="gap:28px">
<div class="rowf noprint" style="align-items:center;justify-content:space-between"><a class="textlink" href="/learn">← My learning</a><div class="rowf" style="gap:12px"><button class="btn btn-sea btn-s" type="button" id="print">Print or save as PDF</button><button class="btn btn-line btn-s" type="button" id="copy">Copy verify link</button></div></div>
<div id="cert"><p class="muted">Loading your certificate…</p></div>
<p class="small muted noprint" id="hint" style="text-align:center"></p>
</div></main>
<div id="site-footer"></div>
<script src="/assets/app.js?v=20261127b"></script>
<script>
var T = window.TCC, no = T.q('no');
T.requireLearner().then(function () { return T.api('GET', '/api/certificates'); }).then(function (r) {
  var c = (r.certificates || []).filter(function (x) { return x.no === no; })[0] || (r.certificates || [])[0];
  if (!c) { document.getElementById('cert').innerHTML = '<p class="note bad">No certificate found. Pass the final exam to earn one.</p>'; return; }
  var link = location.origin + '/verify?no=' + encodeURIComponent(c.no);
  document.getElementById('cert').innerHTML = T.certificate({ n: c.n, title: c.title, no: c.no, date: T.date(c.at), host: location.host });
  document.getElementById('hint').textContent = 'To save a PDF, choose "Save as PDF" as the printer. Turn on "Background graphics" so the colours print.';
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  document.getElementById('copy').addEventListener('click', function () { var b = this; navigator.clipboard.writeText(link).then(function () { b.textContent = 'Link copied'; }, function () { b.textContent = link; }); });
}).catch(function (er) { document.getElementById('cert').innerHTML = '<p class="note bad">' + T.esc(er.message) + '</p>'; });
</script>
</body>
</html>
