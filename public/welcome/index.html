<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome | The Peers Certification</title>
<meta name="description" content="Your enrolment.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=20261127">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1D1916">
</head>
<body>
<div id="site-header"></div>
<main class="narrow sec stack" style="text-align:center;align-items:center;gap:24px"><p class="eyebrow">Enrolment</p><h1 class="d2" id="h">Confirming your <em>payment…</em></h1><p class="lead" id="p">This usually takes a few seconds. Please keep this page open.</p><div id="act"></div></main>
<div id="site-footer"></div>
<script src="/assets/app.js?v=20261127"></script>
<script>
var T = window.TCC, o = T.q('o'), tries = 0;
function done(title) {
  document.getElementById('h').innerHTML = 'You are <em>in.</em>';
  document.getElementById('p').textContent = 'You are enrolled on ' + title + '. We have emailed you a link to choose your password. Open it to start your first module.';
  document.getElementById('act').innerHTML = '<a class="btn btn-ink" href="/login">Go to sign in</a>';
}
function late() {
  document.getElementById('h').innerHTML = 'Almost <em>there.</em>';
  document.getElementById('p').textContent = 'Your payment is still being confirmed. You will get an email with your login as soon as it lands. If nothing arrives within an hour, contact us.';
  document.getElementById('act').innerHTML = '<a class="btn btn-line" href="/contact">Contact us</a>';
}
function check() {
  T.api('GET', '/api/order?o=' + encodeURIComponent(o)).then(function (r) {
    if (r.ok && r.paid) return done(r.title);
    if (++tries > 20 || !r.ok) return late();
    setTimeout(check, 2500);
  }, late);
}
check();
</script>
</body>
</html>
