<template id="tpl-faq"><section class="panel" style="margin-top:24px"><div class="wrap sec rowf" style="gap:32px 72px"><div class="stack" style="flex:1 1 320px;min-width:0"><p class="eyebrow">Questions</p><h2 class="d2" style="max-width:8em">Asked before <em>enrolling.</em></h2></div><div style="flex:1.6 1 520px;min-width:0;border-bottom:1px solid var(--line)"><details class="faq" open><summary>How do I get access after paying?</summary><p>Your login details are emailed as soon as payment goes through. Choose a password and start the first module straight away.</p></details><details class="faq"><summary>Do I need any experience?</summary><p>No. Each certification starts from the foundations and builds up to running real sessions.</p></details><details class="faq"><summary>How long does it take?</summary><p>It is self-paced. Most people finish in three to six months, and you have 12 months of access.</p></details><details class="faq"><summary>How is the exam marked?</summary><p>The final exam is multiple choice and marked instantly. You need 80% to pass and can retake it.</p></details><details class="faq"><summary>Who recognises the certificate?</summary><p>Each certification is accredited by [ACCREDITING BODY]. Every certificate carries a number clients and employers can check on our site.</p></details><details class="faq"><summary>Can I get a refund?</summary><p>Yes. You are covered by our [X]-day money-back guarantee, as long as you have not completed the course or downloaded the certificate.</p></details></div></div></section></template>

<script>
var T = window.TCC, main = document.getElementById('main'), E = T.esc;
var IC = {

  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', award: '<circle cx="12" cy="9" r="6"/><path d="M8.5 14l-1.5 8 5-3 5 3-1.5-8"/>',

};
function ic(n, s) { return '<svg aria-hidden="true" width="' + (s || 22) + '" height="' + (s || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IC[n] + '</svg>'; }

T.catalogue().then(function (list) {

  if (!/^certified-/.test(slug)) slug = '';
  var idx = -1; list.forEach(function (x, i) { if (x.id === want || (x.slug && (x.slug === slug || x.slug === want))) idx = i; });
  var c = list[idx];

  var doubts = P && P.doubts ? '<section style="background:#fff"><div class="wrap sec stack" style="gap:40px"><h2 class="d2">' + H(P.doubts.title) + '</h2><div class="doubts">' + P.doubts.list.map(function (x) { return '<div class="doubt"><h3>' + E(x.q) + '</h3><p style="font-size:18px">' + E(x.a) + '</p></div>'; }).join('') + '</div></div></section>' : '';

  var nums = '<section class="dark"><div class="wrap nums">' +
    '<div><b>' + n + '</b><span>modules, from first principles to running real sessions</span></div>' +
    '<div><b>100%</b><span>online and self-paced, on any device</span></div>' +
    '<div><b>12</b><span>months of access to study and revisit</span></div>' +
    '<div><b>1</b><span>certificate with your name and a number anyone can verify</span></div></div></section>';

  var life = P && P.day ? '' : '<section><div class="wrap sec rowf" style="align-items:center;gap:40px 64px">' +

  var cert = '<section class="sandbg"><div class="wrap sec rowf" style="align-items:center;gap:48px 72px"><div style="flex:1 1 420px;min-width:0;display:flex;justify-content:center">' + T.certificate({ n: 'Your Name Here', title: c.title, no: 'TPC-000000', date: 'DD Month YYYY', example: true, cls: 'tilt', style: 'max-width:600px' }) + '</div>' +

  var offer = '<section style="padding:24px" class="cta-wrap"><div class="offer"><div class="l"><p class="eyebrow" style="color:var(--sun)">Enrolment open</p><h2>Become a <em>' + E(c.title) + '.</em></h2><div class="rowf" style="align-items:center;gap:14px 22px">' + T.priceHtml(c, 64) + save + '</div><div>' + enrolBtn('btn-sun', 'Enrol now') + '</div><p class="small" style="color:#BFD6D2">One payment. No subscription. Start today.</p></div>' +

}, function () { main.innerHTML = '<div class="wrap sec"><p>We could not load this page. Please refresh.</p></div>'; });
</script>
