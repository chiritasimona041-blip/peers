  var fit = '<section><div class="wrap sec stack" style="gap:36px"><div class="stack" style="gap:14px"><p class="eyebrow">Honest fit check</p><h2 class="d2">Is this <em>for you?</em></h2></div><div class="fit">' +
    '<div class="fit-yes"><h3>Made for</h3><ul>' + yes.map(function (x) { return '<li>' + ic('check', 20) + '<span>' + E(x) + '</span></li>'; }).join('') + '</ul></div>' +
    '<div class="fit-no"><h3>Not yet, if</h3><ul>' + no.map(function (x) { return '<li><span class="x" aria-hidden="true">×</span><span>' + E(x) + '</span></li>'; }).join('') + '</ul></div></div></div></section>';

  var rel = list.filter(function (x) { return x.id !== c.id && x.tag === c.tag; }).concat(list.filter(function (x) { return x.id !== c.id && x.tag !== c.tag; })).slice(0, 3);
  var related = '<section><div class="wrap sec stack" style="gap:40px"><div class="rowf" style="align-items:flex-end;justify-content:space-between"><h2 class="d2">You might also <em>like.</em></h2><a class="btn btn-line btn-s" href="/certifications">View all ' + list.length + '</a></div><div class="cgrid">' + rel.map(function (x, i) {
    return '<article class="icard"><a class="pic" href="' + T.url(x) + '"><img src="' + T.photoFor(x, i) + '" alt="" loading="lazy"><span class="tagpill">' + E(x.tag) + '</span></a><div class="body"><p class="eyebrow">' + E(x.sub) + '</p><h3><a href="' + T.url(x) + '">' + E(x.title) + '</a></h3><div class="foot">' + T.priceHtml(x) + '<a class="btn btn-ink btn-s" href="' + T.url(x) + '">View</a></div></div></article>'; }).join('') + '</div></div></section>';

  var spec = '<section><div class="wrap sec rowf" style="gap:40px 72px"><div class="stack" style="flex:1 1 320px;min-width:0;gap:18px"><p class="eyebrow">Programme specification</p><h2 class="d2" style="max-width:9em">The award, <em>in full.</em></h2><p class="lead">What you study, how you are examined and what you hold at the end.</p></div>' +
    '<dl class="spec" style="flex:1.5 1 480px;min-width:0">' + [['Award', c.title], ['School', school], ['Curriculum', n + ' modules, taken in order'], ['Study mode', 'Online, self-paced, on any device'], ['Access', '12 months from enrolment'], ['Assessment', 'Final examination, multiple choice'], ['Pass mark', '80%, with retakes allowed'], ['Certificate', 'Named, numbered and publicly verifiable']].concat(g ? [['Guarantee', g + '-day money-back guarantee']] : []).map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + E(r[1]) + '</dd></div>'; }).join('') + '</dl></div></section>';
  main.innerHTML = hero + nums + fit + why + day + life + learn + mid + outline + care + clients + uses + cert + stories + document.getElementById('tpl-steps').innerHTML + doubts + offer + document.getElementById('tpl-faq').innerHTML +
    '<div class="sticky-enrol" id="sticky"><span class="t">' + E(c.title) + '</span>' + T.priceHtml(c, 26) + (c.offer ? '<span class="st-end">' + c.offer.pct + '% off until ' + E(T.endDate(c.offer.until)) + '</span>' : '') + '<button class="btn btn-sea btn-s" type="button" data-enrol="' + E(c.id) + '">Enrol now</button></div>';
  T.tick();
  [].forEach.call(document.querySelectorAll('[data-preview]'), function (b) { b.addEventListener('click', function () { preview(c); }); });
  fetch('/tutor.json', { credentials: 'omit' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (t) { if (t) tutor(t); }).catch(function () {});
  var am = document.getElementById('allmods');
  if (am) am.addEventListener('click', function () { [].forEach.call(document.querySelectorAll('.mods .extra'), function (li) { li.classList.remove('hide'); }); am.remove(); });
  var st = document.getElementById('sticky');
  var onScroll = function () { st.classList.toggle('show', window.scrollY > 640 && window.scrollY + window.innerHeight < document.documentElement.scrollHeight - 500); };
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
}, function () { main.innerHTML = '<div class="wrap sec"><p>We could not load this page. Please refresh.</p></div>'; });

// Module 1, free: the real first lesson in a window, with the way to enrol right under it.
function preview(c) {
  var old = document.querySelector('.modal'); if (old) old.remove();
  var d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = '<div class="box wide" role="dialog" aria-modal="true" aria-labelledby="pv-h"><button type="button" class="x" aria-label="Close"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>' +
    '<p class="eyebrow">Free preview</p><h2 id="pv-h" class="d3" style="padding-right:48px">Module 1: <em>' + E(c.outline[0] ? c.outline[0].title : c.title) + '</em></h2>' +
    '<iframe class="pv-frame" src="' + E(c.preview) + '" title="Module 1 preview" allow="fullscreen; autoplay" allowfullscreen></iframe>' +
    '<p class="small muted" style="margin:-8px 0 0">Not loading? <a href="' + E(c.preview) + '" target="_blank" rel="noopener">Open module 1 in a new tab</a>.</p>' +
    '<div class="rowf" style="align-items:center;justify-content:space-between;gap:12px 20px"><p style="margin:0">Like it? The other ' + Math.max(c.modules - 1, 0) + ' modules, the exam and your certificate are one step away.</p><button class="btn btn-sea" type="button" data-enrol="' + E(c.id) + '">Enrol now' + T.ARROW + '</button></div></div>';
  document.body.appendChild(d);
  var onKey = function (e) { if (e.key === 'Escape') close(); };
  var close = function () { d.remove(); document.removeEventListener('keydown', onKey); };
  d.querySelector('.x').addEventListener('click', close);
  d.addEventListener('click', function (e) { if (e.target === d) close(); });
  d.querySelector('[data-enrol]').addEventListener('click', function () { close(); }, true);
  document.addEventListener('keydown', onKey);
  d.querySelector('.x').focus();
}

// Your tutor: shown only when public/tutor.json holds a real person (name, role, bio; photo and credentials optional).
function tutor(t) {
  var slot = document.getElementById('tutor'); if (!slot || !t || !t.name || !t.bio) return;
  var creds = Array.isArray(t.credentials) ? t.credentials.slice(0, 6) : [];
  slot.outerHTML = '<section class="sandbg"><div class="wrap sec rowf" style="align-items:center;gap:40px 72px">' +
    (t.photo ? '<div style="flex:0 1 380px;min-width:0"><div class="photo" style="height:440px"><img src="' + E(t.photo) + '" alt="' + E(t.name) + '" loading="lazy"></div></div>' : '') +
    '<div class="stack" style="flex:1 1 420px;min-width:0;gap:22px"><p class="eyebrow">Your tutor</p><h2 class="d2">' + E(t.name) + '</h2>' + (t.role ? '<p class="lead" style="margin:0">' + E(t.role) + '</p>' : '') +
    String(t.bio).split(/\n\n+/).slice(0, 4).map(function (x) { return '<p class="bigp">' + E(x) + '</p>'; }).join('') +
    (creds.length ? '<ul class="lines" style="margin:0;padding:0;list-style:none">' + creds.map(function (x) { return '<li class="d4" style="font-size:22px">' + E(x) + '</li>'; }).join('') + '</ul>' : '') + '</div></div></section>';
}
</script>
