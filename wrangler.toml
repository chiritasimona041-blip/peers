name = "peers"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# thepeerscertification.com is attached as a Custom Domain (Cloudflare creates its DNS record and certificate).
# www already has a proxied DNS record, so it reaches the site through a route.
routes = [
  { pattern = "thepeerscertification.com", custom_domain = true },
  { pattern = "www.thepeerscertification.com/*", zone_name = "thepeerscertification.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "thepeerscertification"
database_id = "e48430c1-1c5c-42da-aa38-9b864fde1ab8"
migrations_dir = "migrations"

# Hourly: unfinished-enrolment reminder. At 07:00 UTC it also sends study reminders and the daily summary.
[triggers]
crons = ["0 * * * *"]

[vars]
BRAND_NAME = "The Peers Certification"
SITE_ORIGIN = "https://thepeerscertification.com"
CURRENCY = "gbp"
PASS_MARK = "80"
# Launch offer: 30% off every certification until the end of 31 December 2026 (UK time). After that date the full price
# comes back on its own, on the pages and at checkout. To end it early, or for a new offer, change these two lines.
OFFER_PCT = "30"
OFFER_UNTIL = "2026-12-31T23:59:59Z"
# Money-back guarantee shown next to the price (must match the Refunds page).
GUARANTEE_DAYS = "14"
CERT_PREFIX = "TPC"
NOTIFY_TO = "info@thepeerscertification.com"
# Namecheap Private Email: the site sends from this mailbox. Its password is the SMTP_PASS secret (Cloudflare > peers > Settings > Variables and Secrets).
SMTP_USER = "info@thepeerscertification.com"
SMTP_HOST = "mail.privateemail.com"
SMTP_PORT = "465"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/certified-*"]
